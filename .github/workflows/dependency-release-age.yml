name: Dependency Release Age

# LEA-197: no change may adopt an npm or PyPI release younger than 7 days (the org Renovate
# minimumReleaseAge). Every pinned npm/PyPI version (uv.lock, package-lock.json, and inline pins in
# workflows) is resolved through Aikido Safe Chain, which hides releases younger than 168 h;
# Aikido-confirmed CVE patch releases are exempt. Pull requests, queue entries and pushes check
# only the pins their first parent lacks; a manual run checks every pin.
#
# Copy of AskZeno/infrastructure's gate (.github/actions/dependency-release-age and
# scripts/dependency_release_age.py, infra#2981). This repository is public, so it cannot call
# actions in that private repository or use its self-hosted runners; keep this copy in step with
# infra's gate. The job name is the org-required check name; no `paths:` filter on purpose.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - zeno
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-age:
    name: Dependency release age (npm, PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit (or queue / pushed commit) and its first parent, the base.
          fetch-depth: 2

      # Resolved before Safe Chain adds its python shim, so the gate script and the throwaway
      # venvs use the plain interpreter.
      - name: Record interpreter
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          echo "GATE_PYTHON=$(command -v python3)" >> "${GITHUB_ENV}"
          if [ "${FULL}" != true ] && ! git rev-parse --verify --quiet HEAD^1 >/dev/null; then
            echo "::error::HEAD^1 is missing; check out with fetch-depth: 2"
            exit 1
          fi

      - name: No Safe Chain bypass in the repository
        run: '"${GATE_PYTHON}" -I .github/scripts/dependency_release_age.py guard --root "${GITHUB_WORKSPACE}"'

      # uv is not on GitHub-hosted runners; npm is. Safe Chain must come after every setup-* step.
      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Set up Safe Chain
        uses: ./.github/actions/safe-chain

      - name: Canary (a boto3 release younger than 7 days must not resolve)
        run: '"${GATE_PYTHON}" -I .github/scripts/dependency_release_age.py canary'

      - name: Resolve the npm and PyPI pins this change adds
        env:
          UV_NO_CACHE: "1"
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "${FULL}" = true ]; then
            "${GATE_PYTHON}" -I .github/scripts/dependency_release_age.py check --root "${GITHUB_WORKSPACE}"
          else
            "${GATE_PYTHON}" -I .github/scripts/dependency_release_age.py check --root "${GITHUB_WORKSPACE}" --base HEAD^1
          fi
